name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      native_case:
        description: 'Run all checks, or diagnose one native panel'
        type: choice
        default: all
        options: [all, panel, usage, settings, catalog, reports, permissions]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ inputs.native_case || 'all' }}
  cancel-in-progress: true

jobs:
  core:
    if: ${{ !inputs.native_case || inputs.native_case == 'all' }}
    name: Core (${{ matrix.configuration }})
    strategy:
      fail-fast: false
      matrix:
        configuration: [debug, release]
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Unit tests and build
        run: swift test -c "$CONFIGURATION"
        env:
          CONFIGURATION: ${{ matrix.configuration }}
      - name: Build and release tool checks
        if: ${{ matrix.configuration == 'debug' }}
        run: python3 scripts/test-build-tools.py
      - name: Install lifecycle checks
        if: ${{ matrix.configuration == 'debug' }}
        run: |
          python3 scripts/test-install.py
          python3 scripts/test-app-install.py
      - name: Agent skill queries (synthetic history)
        if: ${{ matrix.configuration == 'debug' }}
        run: python3 scripts/test-agent-skill.py
      - name: Parallel integration tests
        timeout-minutes: 6
        run: python3 scripts/test-integration.py ".build/$CONFIGURATION/computer-history" --logs ".build/integration-$CONFIGURATION"
        env:
          CONFIGURATION: ${{ matrix.configuration }}
      - name: Integration logs
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-${{ matrix.configuration }}
          path: .build/integration-${{ matrix.configuration }}/*.log
          if-no-files-found: ignore
      - name: Package tested binaries
        if: ${{ matrix.configuration == 'release' }}
        run: bash scripts/package-release.sh --skip-build
      - name: Credential helper upgrade (synthetic)
        if: ${{ matrix.configuration == 'release' }}
        run: |
          version="$(cat VERSION)"
          fixture="$(mktemp -d)"
          trap 'rm -rf "$fixture"' EXIT
          tar -xzf "dist/ComputerHistory-v${version}-macos-arm64.tar.gz" -C "$fixture"
          python3 scripts/test-app-upgrade.py "$fixture/ComputerHistory-v${version}-macos-arm64/ComputerHistory.app" --adhoc
      - name: Upload binaries
        if: ${{ matrix.configuration == 'release' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ComputerHistory-macos-arm64
          path: dist/*.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  native:
    name: Native panels (${{ inputs.native_case || 'all' }})
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build shared panel test executable
        run: python3 scripts/build-menubar-tests.py
      - name: Native panel checks
        timeout-minutes: 8
        env:
          NATIVE_CASE: ${{ inputs.native_case || 'all' }}
        run: |
          if [[ "$NATIVE_CASE" == all ]]; then
            cases=(panel usage settings catalog reports permissions)
          else
            cases=("$NATIVE_CASE")
          fi
          for test_case in "${cases[@]}"; do
            echo "::group::Native panel: $test_case"
            if [[ "$test_case" == catalog ]]; then
              python3 scripts/test-menubar-catalog.py
            else
              bash scripts/test-menubar-panel.sh "scripts/test-menubar-$test_case.swift"
            fi
            echo '::endgroup::'
          done
